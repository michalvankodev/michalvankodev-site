name: preview
# PR preview deployments (specs/CI-deploy.md "Preview deployments", D10-D12).
# Every open PR gets a live preview at https://<label>.dev.michalvanko.dev/
# where <label> is the sanitized head-branch name.
#
# Lifecycle (D11): opened/synchronize/reopened -> build + deploy;
# closed (incl. merged) -> teardown. Preview builds use PORT=3082 so they
# can never collide with a prod pipeline run on 3081.
#
# Push rebuilds (2026-09-07): branch pushes also rebuild the preview when
# an OPEN PR's head branch is the pushed branch. Stacked-PR merges land as
# pushes to the base branch (e.g. commits merging into redesign/00-foundation)
# and fire no pull_request event for the PRs headed by that branch — without
# this, dependent previews go stale until their own PR gets activity.
#
# Storage (D12): previews are hardlink overlays over prod dist/ — a preview
# costs only its delta on disk. Image cache is hardlink-restored from prod so
# the generator only creates variants that don't exist yet.
#
# Security (D6, host mode): the runner executes on katelyn as michalvanko.
# Same-repo PRs are trusted; fork PRs must pass Forgejo's approval gate for
# pull_request workflows (repo setting — keep it enabled).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches-ignore: [main]

env:
  PORT: "3082"
  PROD_DIST: /home/michalvanko/.config/containers/systemd/michalvankodev-site/dist
  PREVIEW_ROOT: /home/michalvanko/previews
  CARGO_TARGET_DIR: /home/michalvanko/forgejo-runner-cache/target

jobs:
  meta:
    name: preview hostname
    runs-on: host
    outputs:
      hostname: ${{ steps.label.outputs.HOSTNAME }}
      should_deploy: ${{ steps.label.outputs.SHOULD_DEPLOY }}
      pr_number: ${{ steps.label.outputs.PR_NUMBER }}
    steps:
      - id: label
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_REF: ${{ github.ref_name }}
          API: ${{ github.api_url }}
        run: |
          BRANCH="$PR_HEAD_REF"
          PR="$PR_NUMBER"
          SHOULD_DEPLOY=true
          if [ -z "$BRANCH" ]; then
            # push event: rebuild only if some OPEN PR's head branch is the
            # pushed branch (head-matched, not base — bases get refreshed by
            # their own PRs' previews, headless pushes must not create orphans).
            # The resolved PR number feeds the preview-link comment below.
            BRANCH="$PUSH_REF"
            PR=$(curl -s "$API/repos/$GITHUB_REPOSITORY/pulls?state=open&limit=50" \
              | jq -r --arg b "$BRANCH" '[.[] | select(.head.ref == $b)][0].number // empty' || true)
            if [ -n "$PR" ]; then
              echo "Push to $BRANCH — open PR #$PR, rebuilding preview"
            else
              echo "Push to $BRANCH — no open PR with this head branch, skipping"
              SHOULD_DEPLOY=false
            fi
          fi
          LABEL=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | cut -c1-63)
          echo "HOSTNAME=${LABEL}.dev.michalvanko.dev" >> "$GITHUB_OUTPUT"
          echo "SHOULD_DEPLOY=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$PR" >> "$GITHUB_OUTPUT"
          echo "Preview hostname: ${LABEL}.dev.michalvanko.dev (deploy=$SHOULD_DEPLOY, pr=${PR:-none})"

  deploy:
    name: build + deploy preview
    if: github.event.action != 'closed' && needs.meta.outputs.should_deploy == 'true'
    needs: meta
    runs-on: host
    env:
      HOSTNAME_DIR: ${{ needs.meta.outputs.hostname }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true   # source images live in LFS; the build decodes them

      - name: Install npm dependencies
        run: |
          # Build clock starts here — first step of the build chain — and is
          # reported in the PR comment.
          echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          npm install

      - name: Build CSS
        run: just tailwind_build

      - name: Build release binary
        run: cargo build --release

      - name: Restore generated images from production (hardlinks)
        run: |
          mkdir -p generated_images
          if [ -d "$PROD_DIST/generated_images" ]; then
            # cp -al: instant, 0 bytes — safe because the generator only
            # creates missing files, never mutates existing ones (D12).
            cp -al "$PROD_DIST/generated_images/." generated_images/
          else
            echo "::warning::No generated images on production — generating all image variants"
          fi
          # Cache-hit accounting for the PR comment: everything restored here
          # that still exists in the final dist was a hit; the rest was newly
          # generated by this build.
          echo "CACHED_IMAGES=$(find generated_images -type f | wc -l)" >> "$GITHUB_ENV"

      - name: SSG export (server + crawl in one step)
        # forgejo-runner kills the process group when a step ends, so the
        # server, the wait loop and the crawl MUST share one step (D8).
        run: |
          nohup just prod > server.log 2>&1 &
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$PORT/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Server is up (HTTP $code)"
              break
            fi
            sleep 2
          done
          if [ -z "${code:-}" ] || [ "$code" = "000" ]; then
            echo "::error::Server did not come up"
            tail -50 server.log || true
            exit 1
          fi
          just ssg
          just kill || pkill -f axum_server || true
          # The crawler must not be trusted with dist completeness: wget may
          # miss srcset variants and the lazy async image generation races the
          # crawl. Sync all generated image variants into dist explicitly.
          rsync -a generated_images/ dist/generated_images/

      - name: Server log
        if: always()
        run: cat server.log || true

      - name: Deploy preview (hardlink overlay over prod)
        run: |
          mkdir -p "$PREVIEW_ROOT"
          # Size of the previous deploy of this preview — rsync --delete
          # replaces the tree, so capture it first: the PR comment reports
          # the size delta between deploys.
          PREV_BYTES=""
          if [ -d "$PREVIEW_ROOT/$HOSTNAME_DIR" ]; then
            PREV_BYTES=$(du -sb "$PREVIEW_ROOT/$HOSTNAME_DIR" | cut -f1)
          fi
          # Branch delta vs prod, itemized without transferring. With
          # --link-dest, unchanged files itemize as 'hf' (hardlinked) — the
          # real delta is new/updated ('>f'/'.f'), local copies ('cf') and
          # deletions.
          CHANGED_FILES=$(rsync -ain --delete --link-dest="$PROD_DIST/" ./dist/ "$PREVIEW_ROOT/$HOSTNAME_DIR/" \
            | grep -cE '^[<>c.][f]|^\*deleting' || true)
          TOTAL_IMAGES=$(find dist/generated_images -type f 2>/dev/null | wc -l)
          NEW_IMAGES=$((TOTAL_IMAGES - ${CACHED_IMAGES:-0}))
          if [ "$TOTAL_IMAGES" -gt 0 ]; then
            CACHE_PCT=$(((CACHED_IMAGES) * 100 / TOTAL_IMAGES))
            IMAGE_CACHE_LINE="${CACHE_PCT}% hit — ${CACHED_IMAGES} of ${TOTAL_IMAGES} variants from prod cache (${NEW_IMAGES} generated)"
          else
            IMAGE_CACHE_LINE="no generated images"
          fi
          BUILD_SECS=$(( $(date +%s) - BUILD_STARTED_AT ))
          BUILD_DURATION="$((BUILD_SECS / 60))m $((BUILD_SECS % 60))s"
          # Files identical to prod become hardlinks; only the branch delta
          # (new/changed HTML + new image variants) is written (D12).
          rsync -a --delete --link-dest="$PROD_DIST/" ./dist/ "$PREVIEW_ROOT/$HOSTNAME_DIR/"
          NEW_BYTES=$(du -sb ./dist | cut -f1)
          HTML_PAGES=$(find dist -name '*.html' -type f | wc -l)
          {
            echo "PREV_BYTES=$PREV_BYTES"
            echo "NEW_BYTES=$NEW_BYTES"
            echo "HTML_PAGES=$HTML_PAGES"
            echo "CHANGED_FILES=$CHANGED_FILES"
            echo "IMAGE_CACHE_LINE=$IMAGE_CACHE_LINE"
            echo "BUILD_DURATION=$BUILD_DURATION"
            echo "DEPLOYED_AT=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_ENV"
          echo "Preview deployed: https://$HOSTNAME_DIR/"

      - name: Comment preview URL on the PR
        # Upsert a single marker comment instead of piling up a new one per
        # push: POST on first deploy, PATCH on every re-deploy (both
        # PR-triggered and push-triggered rebuilds — meta resolves the PR
        # number for pushes). Reports commit, deploy time and the dist size
        # delta. Best-effort: a failed comment must not fail the deploy.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.meta.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          human() { numfmt --to=iec-i --suffix=B -- "$1"; }

          URL="https://$HOSTNAME_DIR/"
          MARKER='<!-- preview-link -->'
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          SHORT_SHA="${HEAD_SHA:0:7}"

          if [ -n "${PREV_BYTES:-}" ] && [ -n "${NEW_BYTES:-}" ]; then
            d=$((NEW_BYTES - PREV_BYTES))
            if [ "$d" -gt 0 ]; then DELTA="▲ +$(human "$d")"
            elif [ "$d" -lt 0 ]; then DELTA="▼ $(human "$d")"
            else DELTA="± no change"; fi
            SIZE_LINE="$(human "$NEW_BYTES") — $DELTA vs previous deploy"
          else
            SIZE_LINE="$(human "${NEW_BYTES:-0}") — first deploy"
          fi

          body="$MARKER
          ## 🚀 Live preview

          **$URL**

          | | |
          |---|---|
          | commit | \`$SHORT_SHA\` |
          | deployed | $DEPLOYED_AT |
          | build | ${BUILD_DURATION:-?} |
          | dist size | $SIZE_LINE |
          | changed vs prod | ${CHANGED_FILES:-?} files |
          | pages | ${HTML_PAGES:-?} html |
          | image cache | ${IMAGE_CACHE_LINE:-?} |

          <sub>first visit can take a few seconds — on-demand TLS</sub>"

          comment_id=$(curl -sSf -H "Authorization: token $GITHUB_TOKEN" "$API?per_page=100" \
            | jq -r --arg m "$MARKER" '[.[] | select(.body | contains($m))][0].id // empty')
          if [ -n "$comment_id" ]; then
            method=PATCH
            endpoint="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          else
            method=POST
            endpoint="$API"
          fi
          if curl -sSf -X "$method" -H "Authorization: token $GITHUB_TOKEN" \
               -H 'Content-Type: application/json' \
               -d "$(jq -n --arg b "$body" '{body: $b}')" "$endpoint" > /dev/null; then
            echo "Preview comment $method on PR #$PR_NUMBER: $URL"
          else
            echo "::warning::Could not comment the preview URL on PR #$PR_NUMBER"
          fi

  teardown:
    name: teardown preview
    if: github.event.action == 'closed'
    needs: meta
    runs-on: host
    steps:
      - name: Remove preview directory
        run: |
          rm -rf "$PREVIEW_ROOT/${{ needs.meta.outputs.hostname }}"
          echo "Preview ${{ needs.meta.outputs.hostname }} torn down"

      - name: Update the PR comment (preview removed)
        # Edit the existing marker comment so the PR is not left with a dead
        # link. Best-effort — teardown must not fail because of the API.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.meta.outputs.pr_number }}
        run: |
          MARKER='<!-- preview-link -->'
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          comment_id=$(curl -sSf -H "Authorization: token $GITHUB_TOKEN" "$API?per_page=100" \
            | jq -r --arg m "$MARKER" '[.[] | select(.body | contains($m))][0].id // empty')
          if [ -z "$comment_id" ]; then
            echo 'No preview comment to update'
            exit 0
          fi
          body="$MARKER
          ## 🪦 Live preview

          removed (PR closed)"
          if curl -sSf -X PATCH -H "Authorization: token $GITHUB_TOKEN" \
               -H 'Content-Type: application/json' \
               -d "$(jq -n --arg b "$body" '{body: $b}')" \
               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" > /dev/null; then
            echo "Preview comment marked as removed on PR #$PR_NUMBER"
          else
            echo "::warning::Could not update the preview comment on PR #$PR_NUMBER"
          fi
