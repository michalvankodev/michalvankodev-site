name: test
# Deploy (deploy.yaml) runs its own test job on pushes to main;
# this workflow covers feature-branch pushes.
# push-only (no pull_request) per specs/CI-deploy.md D6: host-mode runner on a
# public repo - fork PRs must not execute untrusted workflow code on katelyn.
# Same-repo branches are tested via their push events; PRs from those branches
# are therefore covered too.
on: [push]

# Shared persistent Rust build cache on the host (spec D6): the runner
# always builds on this same machine, so a fixed CARGO_TARGET_DIR makes
# every build incremental across runs (registry cache at ~/.cargo persists
# the same way). Reset with rm -rf ~/forgejo-runner-cache/target.
env:
  CARGO_TARGET_DIR: /home/michalvanko/forgejo-runner-cache/target

jobs:
  test:
    name: cargo test
    runs-on: host
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --all-features
