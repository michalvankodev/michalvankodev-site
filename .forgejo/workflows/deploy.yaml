name: deploy
# Builds the site, exports static HTML via SSG crawl and rsyncs it to production.
# Generated images are restored from production before the build so they are
# never regenerated unless they don't exist yet (image_generator skips existing files).
#
# Host mode (specs/CI-deploy.md D6/D8): the runner executes directly on katelyn
# as user michalvanko. Tools come from the host (rustup, node, just, git-lfs,
# rsync, exiftool); the deploy is a local rsync - no SSH, no pinned IP.
# CARGO_TARGET_DIR persists outside the workspace so cargo builds stay
# incremental across runs (replaces rust-cache).
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PORT: "3081"
  DEPLOY_DIR: /home/michalvanko/.config/containers/systemd/michalvankodev-site/dist
  CARGO_TARGET_DIR: /home/michalvanko/forgejo-runner-cache/target

jobs:
  test:
    name: cargo test
    runs-on: host
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true   # tests decode real image fixtures (LFS pointers break decoding)
      - run: cargo test --all-features

  deploy:
    name: build, export, deploy
    runs-on: host
    needs: test
    steps:
      - name: Checkout with LFS images
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install npm dependencies
        run: npm install

      - name: Build CSS
        run: just tailwind_build

      - name: Build release binary
        run: cargo build --release

      - name: Restore generated images from production
        run: |
          mkdir -p generated_images
          rsync -a "$DEPLOY_DIR/generated_images/" generated_images/ \
            || echo "::warning::No generated images on production yet - generating all images"

      - name: SSG export (server + crawl in one step)
        # forgejo-runner kills the process group when a step ends, so the
        # server, the wait loop and the crawl MUST share one step.
        run: |
          nohup just prod > server.log 2>&1 &
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$PORT/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Server is up (HTTP $code)"
              break
            fi
            sleep 2
          done
          if [ -z "${code:-}" ] || [ "$code" = "000" ]; then
            echo "::error::Server did not come up"
            tail -50 server.log || true
            exit 1
          fi
          just ssg
          just kill || pkill -f axum_server || true
          # The crawler must not be trusted with dist completeness: wget may
          # miss srcset variants and the lazy async image generation races the
          # crawl. Sync all generated image variants into dist explicitly.
          rsync -a generated_images/ dist/generated_images/

      - name: Server log
        if: always()
        run: |
          pwd; ls -la | head -5
          cat server.log || true

      - name: Deploy to production
        run: rsync -a --delete ./dist/ "$DEPLOY_DIR/"

      - name: Upload dist artifact
        # v4+ of @actions/artifact hard-errors on Forgejo (GHES check);
        # v3 is the newest major that works here.
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
          retention-days: 10
