{% macro talent_card(svg, heading, description) %}
<section class="flex gap-4 py-5 border-b border-slate-200">
  <svg
    role="img"
    aria-label="{{svg}} icon"
    aria-hidden="true"
    class="fill-blue-950 h-10 w-10 md:h-12 md:w-12 shrink-0 self-center"
  >
    <use href="#{{svg}}" />
  </svg>
  <div>
    <h3 class="font-display text-lg font-semibold text-blue-950 md:text-xl">{{heading}}</h3>
    <p class="text-base text-slate-700 leading-relaxed mt-1 md:text-read">{{description|safe}}</p>
  </div>
</section>
{% endmacro %}
