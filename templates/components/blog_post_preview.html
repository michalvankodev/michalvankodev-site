<article
	class="grid md:grid-cols-[7.5rem_1fr] gap-x-6 py-7 border-b border-slate-200"
	style="view-transition-name:blog_post_preview_{{post.slug}};"
>
	<time
		datetime="{{post.metadata.date}}"
		class="font-sans text-xs md:text-sm text-slate-500 md:text-right tabular-nums md:pt-1.5"
		style="view-transition-name: post_date_{{post.slug}}"
	>{{post.metadata.date|pretty_date}}</time>
	<div>
		<h3 class="font-sans text-lg md:text-xl font-semibold leading-snug">
		  <a rel="prefetch" href="/{{segment}}/{{post.slug}}" class="text-blue-950 no-underline hover:text-blue-500" style="view-transition-name: post_title_{{post.slug}}">{{post.metadata.title}}</a>
		</h3>
		<div class="font-serif text-read text-slate-700 leading-relaxed mt-1.5 line-clamp-2 text-left">{{post.body|truncate_md(2)|parse_markdown|safe}}</div>
		<ul class="mt-2 flex flex-wrap gap-x-3 font-sans text-xs md:text-sm" style="view-transition-name: post_tags_{{post.slug}}">
     {% for tag in post.metadata.tags %}
      <li>
        <a href="/{{segment}}/tags/{{tag}}" class="text-pink-950 no-underline hover:text-blue-500">#{{tag|capitalize}}</a>
      </li>
      {% endfor %}
		</ul>
	</div>
</article>
