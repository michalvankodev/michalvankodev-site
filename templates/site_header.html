<header class="min-h-full bg-blue-50 mb-6" view-transition-name="site_header">
  <nav class="flex items-center justify-between">
    <a class="logo p-3 text-base font-medium text-blue-950 no-underline hover:text-blue-500" href="/">
      @michalvankodev
    </a>
    {% match header_props.back_link %}
    {% when Some with (link) %}
    <a
      class="px-3 py-2 text-base font-medium print:hidden"
      href="{{link.href}}"
    >
      {{link.label}}
    </a>
    {% when None %}
    {% endmatch %}
  </nav>
  <hr class="border-slate-300 mx-5">
</header>
