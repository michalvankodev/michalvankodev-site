{% extends "base.html" %}
{% block content %}

<section id="contact-page" class="max-w-read mx-auto px-5">
  <header class="pt-12 pb-2">
    <p class="kicker">~/contact</p>
    <h1 class="text-display-2 lowercase mt-2">
      Contact
    </h1>
  </header>

  <ul class="mt-6">
    {% for link in links %}
    <li class="border-b border-slate-200">
      <a
        class="flex items-center gap-4 py-5 hover:text-blue-500 transition-colors no-underline"
        href="{{link.href}}"
        title="{{link.title}}"
      >
        <svg aria-hidden="true" class="h-5 w-5 fill-blue-950 shrink-0">
          <use xlink:href="#{{link.svg}}" />
        </svg>
        <span class="text-base md:text-lg text-blue-950">{{link.label}}</span>
      </a>
    </li>
    {% endfor %}
  </ul>

  <p class="text-read text-slate-700 mt-8">
    The fastest way to reach me is <a href="mailto:michalvankosk@gmail.com">email</a>.
    I usually reply within a couple of days.
  </p>
</section>

{% endblock %}
