<section class="article-tags text-sm md:text-base">
  {% if tags.len() > 0 %}
  <ul class="inline" style="view-transition-name: post_tags_{{slug}}">
    {% for tag in tags %}
    <li class="inline">
      <a href="/{{segment}}/tags/{{tag}}" class="text-pink-950 no-underline">#{{tag}}</a>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
