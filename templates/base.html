<!doctype html>
<html lang="en">
  <head>
    <title>{% block title %} {{title}} {% endblock %} @michalvankodev</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#f1f7fe" />

    {% block page_description %}
    <meta name="description" content="Personal website of @michalvankodev" />
    {% endblock %}
    <meta name="keywords" content="personal, blog, webdev, tech, programming" />
    <meta name="robots" content="index, follow" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS feed for latest posts"
      href="/feed.xml"
    />
    <link
      rel="alternate"
      type="application/feed+json"
      title="JSON feed for latest posts"
      href="/feed.json"
    />

    <!-- Mastodon --> 
    <link rel="me" href="https://mastodon.online/@michalvankodev" />
    <meta name="fediverse:creator" content="@michalvankodev@mastodon.online">

    {% block og_meta %}
    <meta property="og:title" content="{{ title }} @michalvankodev" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://michalvanko.dev" />
    <meta property="og:image" content="https://michalvanko.dev/images/og-default.png" />
    {% endblock %}

    <!-- Tailwind output file -->
    <link rel="stylesheet" href="{{ crate::assets::css_href()|safe }}" />

    <link rel="icon" type="image/svg+xml" href="/images/m-logo.svg" />
    <link rel="icon" type="image/png" href="/images/m-logo-192.png" />
  </head>
  <body class="bg-blue-50 text-slate-950">
    <a href="#main-content" class="skip-link">skip to content</a>
    <div class="preload-assets" style="display: none">
        {% include "icons/sprite.svg" %}
    </div>
    {% include "site_header.html" %}
    <main id="main-content" tabindex="-1">
      {% block content %} Placeholder {% endblock %}
    </main>
    {% include "site_footer.html" %}
  </body>
</html>
